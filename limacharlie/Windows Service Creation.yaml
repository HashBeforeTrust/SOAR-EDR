detect:
  event: NEW_PROCESS
  op: and
  rules:
    - case sensitive: false
      file name: true
      op: is
      path: event/FILE_PATH
      value: sc.exe
    - case sensitive: false
      op: contains
      path: event/COMMAND_LINE
      value: create
respond:
  - action: report
    name: Windows Service Creation
    priority: 3
    metadata:
      level: medium
      technique: T1543.003
