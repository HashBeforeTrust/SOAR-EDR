detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: or
      rules:
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: powershell.exe
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: pwsh.exe
    - op: or
      rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: System.Net.Sockets.TCPClient
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: Net.Sockets.TcpClient
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: GetStream()
respond:
  - action: report
    name: Possible PowerShell Reverse Shell
    priority: 5
    metadata:
      level: critical
      technique: T1059.001
