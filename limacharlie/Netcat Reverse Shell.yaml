detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: or
      rules:
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: nc.exe
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: ncat.exe
    - op: or
      rules:
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: '-e cmd'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: '-e powershell'
        - case sensitive: false
          op: contains
          path: event/COMMAND_LINE
          value: '--exec'
respond:
  - action: report
    name: Possible Netcat Reverse Shell
    priority: 5
    metadata:
      level: critical
      technique: T1059
