detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: or
      rules:
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: procdump.exe
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: procdump64.exe
        - case sensitive: false
          file name: true
          op: is
          path: event/FILE_PATH
          value: rundll32.exe
    - case sensitive: false
      op: contains
      path: event/COMMAND_LINE
      value: lsass
respond:
  - action: report
    metadata:
      level: critical
      technique: T1003.001
    name: Possible LSASS Credential Dump
    priority: 5
